<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mindscape — an emotional diary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- The 3D world sits underneath everything; all UI is overlaid on it. -->
    <div id="world"></div>

    <!-- Camera feed. Never displayed at size: face-api reads frames from it,
         and the thumbnail exists only so you can tell you're actually in shot. -->
    <video id="camera" autoplay muted playsinline></video>

    <main id="ui">
      <header class="hud hud-top">
        <div class="brand">
          <span class="brand-dot"></span>
          <div>
            <h1>Mindscape</h1>
            <p id="lifetime-summary">a world built from how you felt</p>
          </div>
        </div>

        <nav class="hud-actions">
          <button id="btn-history" class="ghost">History</button>
          <button id="btn-memories" class="ghost">Core memories</button>
          <button id="btn-diagnostics" class="ghost" title="Model diagnostics">
            Signals
          </button>
        </nav>
      </header>

      <!-- Names the place and what is in it. Permanent while you are looking at
           the mind floor, because it is the caption for what is on screen — you
           should never have to remember why the world looks the way it does, or
           travel somewhere to be told. Hidden at the core, which needs no
           caption: an orb is one entry and says so when you click it. -->
      <p id="place-caption" class="hud hud-place" hidden></p>

      <!-- Live per-emotion readout, updated from the mood bus. -->
      <aside id="emotion-panel" class="hud hud-left" aria-live="off">
        <h2>Right now</h2>
        <ul id="emotion-bars"></ul>
        <div class="panel-foot">
          <span id="face-indicator" class="pill pill-off">no face</span>
          <span id="backend-indicator" class="pill pill-off">offline</span>
        </div>
      </aside>

      <section id="transcript-panel" class="hud hud-transcript" hidden>
        <p id="transcript-text"></p>
      </section>

      <footer class="hud hud-bottom">
        <!-- All three labels ship in the markup and are stacked on top of each
             other, with only the active one visible. The button then sizes
             itself to the widest label in whatever font actually loads, so it
             never changes width when the state changes — and never appears to
             jump. A min-width in pixels would have to be guessed, and would be
             wrong the moment Inter fails to load and the fallback is wider. -->
        <button id="btn-record" class="record" data-state="idle">
          <span class="record-ring"></span>
          <span class="record-label">
            <span data-label="idle">Talk about your day</span>
            <span data-label="recording">Finish entry</span>
            <span data-label="busy">Making sense of it…</span>
          </span>
        </button>

        <!-- Moves the camera between the two floors of the world: the island
             built from what you talk about, and the memory orbs underneath it.
             Same stacked-label trick as the record button, so the control does
             not change width when you press it. -->
        <button id="btn-view" class="view-switch" data-view="mind">
          <span class="view-arrow" aria-hidden="true">▾</span>
          <span class="view-label">
            <span data-view-label="mind">View core</span>
            <span data-view-label="core">Back to your mind</span>
          </span>
        </button>

        <p id="record-hint">
          Your camera and voice stay on this machine.
        </p>
      </footer>
    </main>

    <!-- Overlays are plain hidden sections, shown by toggling [hidden]. -->
    <div id="modal-root" hidden>
      <div class="modal-backdrop"></div>
      <div class="modal" role="dialog" aria-modal="true">
        <button class="modal-close" aria-label="Close">×</button>
        <div id="modal-content"></div>
      </div>
    </div>

    <div id="toast" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
